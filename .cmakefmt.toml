[format]
line_ending = "auto"
line_width = 100
tab_size = 4
max_empty_lines = 1
max_hanging_wrap_positional_args = 1
wrap_after_first_arg = false
dangle_parens = true
dangle_align = "prefix"
command_case = "unchanged"
keyword_case = "upper"

[markup]
enable_markup = false

[per_command_overrides.set]
wrap_after_first_arg = false

[commands.add_library.fallback]
pargs = "*"

[commands.execute_process]
flags = [
    "OUTPUT_QUIET",
    "ERROR_QUIET",
    "OUTPUT_STRIP_TRAILING_WHITESPACE",
    "ERROR_STRIP_TRAILING_WHITESPACE",
]

[commands.execute_process.kwargs.COMMAND_ECHO]
nargs = 1

[commands.execute_process.kwargs.COMMAND_ERROR_IS_FATAL]
nargs = 1

[commands.execute_process.kwargs.ENCODING]
nargs = 1

[commands.execute_process.kwargs.ENVIRONMENT]
nargs = "+"

[commands.execute_process.kwargs.ENVIRONMENT_MODIFICATION]
nargs = "+"
